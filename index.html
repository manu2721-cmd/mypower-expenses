function MonthlyPayroll({ staffMap, payrollRuns, dateFormat, onGenerate, onUpdateRow, onRemoveRow }) {
  const [monthOffset, setMonthOffset] = useState(0);
  const [editingUid, setEditingUid] = useState(null);
  const [editDraft, setEditDraft] = useState({});
  const [search, setSearch] = useState("");
  const NDClass = (typeof NepaliDate !== "undefined" && NepaliDate && NepaliDate.default) ? NepaliDate.default : null;

  if (!NDClass) return <Card style={{ color: "var(--rejected)" }}>Nepali calendar isn't available right now — payroll needs it since it's tracked by BS month.</Card>;

  const todayNd = new NDClass(new Date());
  let bsY = todayNd.getYear(), bsM = todayNd.getMonth() + monthOffset;
  while (bsM < 0) { bsM += 12; bsY -= 1; }
  while (bsM > 11) { bsM -= 12; bsY += 1; }
  const bsMonthKey = `${bsY}-${String(bsM + 1).padStart(2, "0")}`;
  const monthLabel = `${BS_MONTH_NAMES[bsM]} ${bsY}`;

  const allRows = Object.entries(payrollRuns[bsMonthKey] || {}).map(([uid, row]) => ({ uid, ...row }))
    .sort((a, b) => ((staffMap[a.uid] || {}).name || "").localeCompare((staffMap[b.uid] || {}).name || ""));

  const q = search.trim().toLowerCase();
  const rows = q ? allRows.filter((r) => {
    const s = staffMap[r.uid] || {};
    const hay = [s.name, r.company, r.status, String(r.basicSalary), String(r.netAmount)].filter(Boolean).join(" ").toLowerCase();
    return hay.includes(q);
  }) : allRows;

  const totals = rows.reduce((acc, r) => { acc.basic += r.basicSalary || 0; acc.tds += r.tdsAmount || 0; acc.net += r.netAmount || 0; return acc; }, { basic: 0, tds: 0, net: 0 });

  const startEdit = (r) => { setEditingUid(r.uid); setEditDraft({ basicSalary: r.basicSalary, tdsRate: r.tdsRate, bonusPercent: r.bonusPercent || 0, expectedDate: r.expectedDate, paidDate: r.paidDate || "" }); };
  const saveEdit = (uid) => {
    const basicSalary = Number(editDraft.basicSalary) || 0;
    const tdsRate = Number(editDraft.tdsRate) || 0;
    const bonusPercent = Number(editDraft.bonusPercent) || 0;
    const tdsAmount = Math.round(basicSalary * tdsRate / 100);
    const bonusAmount = Math.round(basicSalary * bonusPercent / 100);
    const netAmount = basicSalary - tdsAmount + bonusAmount;
    onUpdateRow(bsMonthKey, uid, { basicSalary, tdsRate, tdsAmount, bonusPercent, bonusAmount, netAmount, expectedDate: editDraft.expectedDate, paidDate: editDraft.paidDate || null, status: editDraft.paidDate ? "paid" : "scheduled" });
    setEditingUid(null);
  };

  const exportCSV = () => {
    const header = ["Staff", "Company", "Basic Salary", "TDS Rate %", "TDS Amount", "Bonus %", "Bonus Amount", "Net Payable", "Expected Date", "Status", "Paid Date"];
    const lines = [header.join(",")];
    rows.forEach((r) => {
      const s = staffMap[r.uid] || {};
      const cells = [s.name || r.uid, r.company, r.basicSalary, r.tdsRate, r.tdsAmount, r.bonusPercent || 0, r.bonusAmount || 0, r.netAmount, fmtDate(r.expectedDate, dateFormat), r.status, r.paidDate ? fmtDate(r.paidDate, dateFormat) : ""]
        .map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`);
      lines.push(cells.join(","));
    });
    const blob = new Blob([lines.join("\n")], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `mypower_payroll_${bsMonthKey}.csv`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  };

  return (
    <div style={{ display: "grid", gap: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <button onClick={() => setMonthOffset((m) => m - 1)} style={{ ...ghostBtn, padding: "6px 12px" }}>←</button>
        <div style={{ fontWeight: 600, fontSize: 16 }}>{monthLabel}</div>
        <button onClick={() => setMonthOffset((m) => m + 1)} style={{ ...ghostBtn, padding: "6px 12px" }}>→</button>
      </div>

      <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
        <StatCard label="Total basic" value={totals.basic} />
        <StatCard label="Total TDS" value={totals.tds} accent="var(--pending)" />
        <StatCard label="Total net payable" value={totals.net} accent="var(--approved)" />
      </div>

      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
        <button onClick={() => onGenerate(bsY, bsM)} style={{ ...ghostBtn, background: "var(--brand-yellow)", borderColor: "var(--brand-yellow)" }}>Generate / refresh this month's payroll</button>
        <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search staff, company, status…" style={{ ...smallSelect, flex: "1 1 200px", minWidth: 180 }} />
        <button onClick={exportCSV} style={ghostBtn}>Export CSV</button>
      </div>

      <div style={{ display: "grid", gap: 8 }}>
        {allRows.length === 0 && <Card style={{ color: "var(--ink-soft)" }}>No payroll rows yet for {monthLabel} — click "Generate" above (only staff with a company and salary set will be included).</Card>}
        {allRows.length > 0 && rows.length === 0 && <Card style={{ color: "var(--ink-soft)" }}>No rows match "{search}".</Card>}
        {rows.map((r) => {
          const s = staffMap[r.uid] || {};
          const editing = editingUid === r.uid;
          return (
            <Card key={r.uid}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
                <div>
                  <div style={{ fontWeight: 600, fontSize: 14 }}>{s.name || r.uid}</div>
                  <div style={{ fontSize: 11.5, color: "var(--ink-soft)" }}>{r.company}</div>
                </div>
                <span style={{ fontSize: 10.5, fontWeight: 600, padding: "3px 9px", borderRadius: 999, background: r.status === "paid" ? "var(--approved)" : "var(--pending)", color: "var(--paper)" }}>{r.status === "paid" ? "PAID" : "SCHEDULED"}</span>
              </div>

              {!editing ? (
                <div style={{ marginTop: 10, display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(110px, 1fr))", gap: 10, fontSize: 13 }}>
                  <div><div style={{ fontSize: 10.5, color: "var(--ink-soft)" }}>Basic</div>{fmtNPR(r.basicSalary)}</div>
                  <div><div style={{ fontSize: 10.5, color: "var(--ink-soft)" }}>TDS ({r.tdsRate}%)</div>{fmtNPR(r.tdsAmount)}</div>
                  {r.bonusAmount > 0 && <div><div style={{ fontSize: 10.5, color: "var(--ink-soft)" }}>Bonus ({r.bonusPercent}%)</div>{fmtNPR(r.bonusAmount)}</div>}
                  <div><div style={{ fontSize: 10.5, color: "var(--ink-soft)" }}>Net payable</div><b>{fmtNPR(r.netAmount)}</b></div>
                  <div><div style={{ fontSize: 10.5, color: "var(--ink-soft)" }}>Expected date</div>{fmtDate(r.expectedDate, dateFormat)}</div>
                  {r.paidDate && <div><div style={{ fontSize: 10.5, color: "var(--ink-soft)" }}>Paid on</div>{fmtDate(r.paidDate, dateFormat)}</div>}
                </div>
              ) : (
                <div style={{ marginTop: 10, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                  <div><div style={{ fontSize: 10.5, color: "var(--ink-soft)" }}>Basic</div><input type="number" value={editDraft.basicSalary} onChange={(e) => setEditDraft((d) => ({ ...d, basicSalary: e.target.value }))} style={inputStyle} /></div>
                  <div><div style={{ fontSize: 10.5, color: "var(--ink-soft)" }}>TDS %</div><input type="number" value={editDraft.tdsRate} onChange={(e) => setEditDraft((d) => ({ ...d, tdsRate: e.target.value }))} style={inputStyle} /></div>
                  <div><div style={{ fontSize: 10.5, color: "var(--ink-soft)" }}>Bonus %</div><input type="number" value={editDraft.bonusPercent} onChange={(e) => setEditDraft((d) => ({ ...d, bonusPercent: e.target.value }))} style={inputStyle} /></div>
                  <div><div style={{ fontSize: 10.5, color: "var(--ink-soft)" }}>Expected date</div><input type="date" value={editDraft.expectedDate} onChange={(e) => setEditDraft((d) => ({ ...d, expectedDate: e.target.value }))} style={inputStyle} /></div>
                  <div style={{ gridColumn: "span 2" }}><div style={{ fontSize: 10.5, color: "var(--ink-soft)" }}>Paid date (leave blank if not paid yet)</div><input type="date" value={editDraft.paidDate} onChange={(e) => setEditDraft((d) => ({ ...d, paidDate: e.target.value }))} style={inputStyle} /></div>
                </div>
              )}

              <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
                {editing ? (
                  <>
                    <button onClick={() => saveEdit(r.uid)} style={{ ...ghostBtn, borderColor: "var(--approved)", color: "var(--approved)" }}>Save</button>
                    <button onClick={() => setEditingUid(null)} style={ghostBtn}>Cancel</button>
                  </>
                ) : (
                  <>
                    <button onClick={() => startEdit(r)} style={ghostBtn}>Edit</button>
                    <button onClick={() => { if (window.confirm("Remove this payroll row?")) onRemoveRow(bsMonthKey, r.uid); }} style={{ ...ghostBtn, borderColor: "var(--rejected)", color: "var(--rejected)" }}>Remove</button>
                  </>
                )}
              </div>
              {r.lastEditedBy && <div style={{ fontSize: 10.5, color: "var(--ink-soft)", marginTop: 6, fontStyle: "italic" }}>Last edited by {r.lastEditedBy}</div>}
            </Card>
          );
        })}
      </div>
    </div>
  );
}

// ---------- Payroll Analysis: aggregate view across all months, for trends,
// company/staff breakdowns, and totals. Reads the same payrollRuns data as
// Monthly Payroll but never edits it — this page is reporting-only.
function PayrollAnalysis({ staffMap, payrollRuns, dateFormat }) {
  const [staffFilter, setStaffFilter] = useState("All");
  const [companyFilter, setCompanyFilter] = useState("All");
  const [statusFilter, setStatusFilter] = useState("All");
  const [search, setSearch] = useState("");
  const [view, setView] = useState("table");

  const allRows = useMemo(() => {
    const out = [];
    Object.entries(payrollRuns || {}).forEach(([bsMonthKey, staffRows]) => {
      Object.entries(staffRows || {}).forEach(([uid, row]) => out.push({ bsMonthKey, uid, ...row }));
    });
    return out.sort((a, b) => b.bsMonthKey.localeCompare(a.bsMonthKey));
  }, [payrollRuns]);

  const companyList = useMemo(() => [...new Set(allRows.map((r) => r.company).filter(Boolean))].sort(), [allRows]);
  const staffNameList = useMemo(() => Object.values(staffMap).map((s) => s.name).filter(Boolean), [staffMap]);

  const q = search.trim().toLowerCase();
  const filtered = useMemo(() => allRows.filter((r) => {
    const s = staffMap[r.uid] || {};
    if (staffFilter !== "All" && s.name !== staffFilter) return false;
    if (companyFilter !== "All" && r.company !== companyFilter) return false;
    if (statusFilter !== "All" && r.status !== statusFilter) return false;
    if (q) {
      const [y, mo] = r.bsMonthKey.split("-");
      const monthLabel = `${BS_MONTH_NAMES[Number(mo) - 1]} ${y}`;
      const hay = [s.name, r.company, r.status, r.bsMonthKey, monthLabel].filter(Boolean).join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }), [allRows, staffMap, staffFilter, companyFilter, statusFilter, q]);

  const totals = useMemo(() => filtered.reduce((acc, r) => {
    acc.basic += r.basicSalary || 0; acc.tds += r.tdsAmount || 0; acc.bonus += r.bonusAmount || 0; acc.net += r.netAmount || 0;
    return acc;
  }, { basic: 0, tds: 0, bonus: 0, net: 0 }), [filtered]);

  const byCompany = useMemo(() => {
    const m = {}; filtered.forEach((r) => { m[r.company] = (m[r.company] || 0) + (r.netAmount || 0); });
    return Object.entries(m).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
  }, [filtered]);

  const byStaff = useMemo(() => {
    const m = {}; filtered.forEach((r) => { const n = (staffMap[r.uid] || {}).name || r.uid; m[n] = (m[n] || 0) + (r.netAmount || 0); });
    return Object.entries(m).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
  }, [filtered, staffMap]);

  const byMonth = useMemo(() => {
    const m = {}; filtered.forEach((r) => { m[r.bsMonthKey] = (m[r.bsMonthKey] || 0) + (r.netAmount || 0); });
    return Object.entries(m).map(([key, value]) => {
      const [y, mo] = key.split("-");
      return { name: `${BS_MONTH_NAMES[Number(mo) - 1]} ${y}`, value, key };
    }).sort((a, b) => a.key.localeCompare(b.key));
  }, [filtered]);

  const exportCSV = () => {
    const header = ["Month (BS)", "Staff", "Company", "Basic Salary", "TDS Rate %", "TDS Amount", "Bonus %", "Bonus Amount", "Net Payable", "Expected Date", "Status", "Paid Date"];
    const lines = [header.join(",")];
    filtered.forEach((r) => {
      const s = staffMap[r.uid] || {};
      const [y, mo] = r.bsMonthKey.split("-");
      const cells = [`${BS_MONTH_NAMES[Number(mo) - 1]} ${y}`, s.name || r.uid, r.company, r.basicSalary, r.tdsRate, r.tdsAmount, r.bonusPercent || 0, r.bonusAmount || 0, r.netAmount, fmtDate(r.expectedDate, dateFormat), r.status, r.paidDate ? fmtDate(r.paidDate, dateFormat) : ""]
        .map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`);
      lines.push(cells.join(","));
    });
    const blob = new Blob([lines.join("\n")], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `mypower_payroll_analysis.csv`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  };

  return (
    <div style={{ display: "grid", gap: 16 }}>
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
        <StatCard label="Total basic" value={totals.basic} />
        <StatCard label="Total TDS" value={totals.tds} accent="var(--pending)" />
        <StatCard label="Total bonus" value={totals.bonus} accent="var(--on-leave)" />
        <StatCard label="Total net payable" value={totals.net} accent="var(--approved)" />
      </div>

      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
        <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search staff, company, month…" style={{ ...smallSelect, flex: "1 1 200px", minWidth: 180 }} />
        <select value={staffFilter} onChange={(e) => setStaffFilter(e.target.value)} style={smallSelect}>
          <option>All</option>{staffNameList.map((n) => <option key={n}>{n}</option>)}
        </select>
        <select value={companyFilter} onChange={(e) => setCompanyFilter(e.target.value)} style={smallSelect}>
          <option>All</option>{companyList.map((c) => <option key={c}>{c}</option>)}
        </select>
        <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} style={smallSelect}>
          <option value="All">All</option>
          <option value="scheduled">Scheduled</option>
          <option value="paid">Paid</option>
        </select>
        <div style={{ marginLeft: "auto", display: "flex", gap: 6, flexWrap: "wrap" }}>
          {[["table", "Table"], ["company", "By Company"], ["staff", "By Staff"], ["trend", "Monthly Trend"]].map(([id, label]) => (
            <button key={id} onClick={() => setView(id)} style={{ ...ghostBtn, background: view === id ? "var(--ink)" : "var(--card)", color: view === id ? "var(--paper)" : "var(--ink)" }}>{label}</button>
          ))}
          <button onClick={exportCSV} style={ghostBtn}>Export CSV</button>
        </div>
      </div>

      {view === "table" && (
        <div style={{ display: "grid", gap: 2 }}>
          {filtered.length === 0 && <Card style={{ color: "var(--ink-soft)" }}>No payroll records match these filters.</Card>}
          {filtered.map((r) => {
            const s = staffMap[r.uid] || {};
            const [y, mo] = r.bsMonthKey.split("-");
            return (
              <div key={r.bsMonthKey + r.uid} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 0", borderBottom: "1px solid var(--line)", gap: 10, flexWrap: "wrap" }}>
                <div>
                  <div style={{ fontSize: 13.5, fontWeight: 600 }}>{s.name || r.uid} <span style={{ fontWeight: 400, color: "var(--ink-soft)", fontSize: 12 }}>· {BS_MONTH_NAMES[Number(mo) - 1]} {y}</span></div>
                  <div style={{ fontSize: 11.5, color: "var(--ink-soft)", marginTop: 2 }}>{r.company} · Basic {fmtNPR(r.basicSalary)} · TDS {fmtNPR(r.tdsAmount)}{r.bonusAmount > 0 ? ` · Bonus ${fmtNPR(r.bonusAmount)}` : ""}</div>
                </div>
                <div style={{ textAlign: "right" }}>
                  <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 15 }}>{fmtNPR(r.netAmount)}</div>
                  <span style={{ fontSize: 10, fontWeight: 600, color: r.status === "paid" ? "var(--approved)" : "var(--pending)" }}>{r.status === "paid" ? "PAID" : "SCHEDULED"}</span>
                </div>
              </div>
            );
          })}
        </div>
      )}
      {view === "company" && <Card><SimpleBarChart data={byCompany} /></Card>}
      {view === "staff" && <Card><SimpleBarChart data={byStaff} /></Card>}
      {view === "trend" && <Card><SimpleTrendChart data={byMonth} /></Card>}
    </div>
  );
}

// ---------- Manage (admin only) ----------
function EditableRow({ name, meta, onRename, onRemove, onMoveUp, onMoveDown, canMoveUp, canMoveDown, mergeOptions, onMerge, extra }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(name);
  const [merging, setMerging] = useState(false);
  const [target, setTarget] = useState("");
  const [confirmingRemove, setConfirmingRemove] = useState(false);

  const save = () => {
    if (draft.trim() && draft.trim() !== name) onRename(draft.trim());
    setEditing(false);
  };

  const confirmMerge = () => {
    if (!target) return;
    onMerge(target);
    setMerging(false); setTarget("");
  };

  return (
    <div style={{ padding: "6px 0", borderBottom: "1px solid var(--line)" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13.5, gap: 8 }}>
        {editing ? (
          <input autoFocus value={draft} onChange={(e) => setDraft(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") save(); if (e.key === "Escape") { setDraft(name); setEditing(false); } }}
            onBlur={save} style={{ ...inputStyle, padding: "5px 8px", fontSize: 13, flex: 1 }} />
        ) : (
          <span style={{ flex: 1 }}>{name}{meta && <span style={{ fontSize: 11, color: "var(--ink-soft)", marginLeft: 6 }}>{meta}</span>}</span>
        )}
        <div style={{ display: "flex", gap: 4, flexShrink: 0 }}>
          {onMoveUp && <button onClick={onMoveUp} disabled={!canMoveUp} style={{ ...ghostBtn, padding: "3px 8px", fontSize: 11, opacity: canMoveUp ? 1 : 0.35 }}>↑</button>}
          {onMoveDown && <button onClick={onMoveDown} disabled={!canMoveDown} style={{ ...ghostBtn, padding: "3px 8px", fontSize: 11, opacity: canMoveDown ? 1 : 0.35 }}>↓</button>}
          {!editing && <button onClick={() => { setDraft(name); setEditing(true); }} style={{ ...ghostBtn, padding: "4px 8px", fontSize: 11 }}>Edit</button>}
          {mergeOptions && mergeOptions.length > 0 && <button onClick={() => { setMerging((v) => !v); setConfirmingRemove(false); }} style={{ ...ghostBtn, padding: "4px 8px", fontSize: 11 }}>Merge</button>}
          <button onClick={() => { setConfirmingRemove((v) => !v); setMerging(false); }} style={{ ...ghostBtn, padding: "4px 8px", fontSize: 11, borderColor: "var(--rejected)", color: "var(--rejected)" }}>Remove</button>
        </div>
      </div>
      {extra && <div style={{ marginTop: 6 }}>{extra}</div>}
      {confirmingRemove && (
        <div style={{ display: "flex", gap: 6, alignItems: "center", marginTop: 6, flexWrap: "wrap" }}>
          <span style={{ fontSize: 11.5, color: "var(--rejected)" }}>Delete "{name}"? This can't be undone.</span>
          <button onClick={() => { onRemove(); setConfirmingRemove(false); }} style={{ ...ghostBtn, padding: "4px 10px", fontSize: 11, borderColor: "var(--rejected)", color: "var(--rejected)" }}>Yes, delete</button>
          <button onClick={() => setConfirmingRemove(false)} style={{ ...ghostBtn, padding: "4px 10px", fontSize: 11 }}>Cancel</button>
        </div>
      )}
      {merging && (
        <div style={{ display: "flex", gap: 6, alignItems: "center", marginTop: 6, flexWrap: "wrap" }}>
          <span style={{ fontSize: 11.5, color: "var(--ink-soft)" }}>Merge "{name}" into:</span>
          <select value={target} onChange={(e) => setTarget(e.target.value)} style={{ ...smallSelect, flex: 1, minWidth: 120 }}>
            <option value="">Choose…</option>
            {mergeOptions.map((n) => <option key={n} value={n}>{n}</option>)}
          </select>
          <button onClick={confirmMerge} disabled={!target} style={{ ...ghostBtn, padding: "4px 10px", fontSize: 11 }}>Confirm</button>
          <button onClick={() => setMerging(false)} style={{ ...ghostBtn, padding: "4px 10px", fontSize: 11 }}>Cancel</button>
        </div>
      )}
    </div>
  );
}

function LocationRow({ loc, routers, onUpdate, onRemove, onAddRouter, onRemoveRouter }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState({ name: loc.name, shiftStart: loc.shiftStart || "09:00", graceMinutes: loc.graceMinutes ?? 0, weeklyOff: loc.weeklyOff || [] });
  const [confirmingRemove, setConfirmingRemove] = useState(false);
  const [newSsid, setNewSsid] = useState("");
  const [newBssid, setNewBssid] = useState("");
  const myRouters = routers.filter((r) => r.locationId === loc.id);
  const DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  const save = () => {
    if (draft.name.trim()) onUpdate(loc.id, { name: draft.name.trim(), shiftStart: draft.shiftStart, graceMinutes: Number(draft.graceMinutes) || 0, weeklyOff: draft.weeklyOff });
    setEditing(false);
  };
  const toggleDay = (i) => setDraft((d) => ({ ...d, weeklyOff: d.weeklyOff.includes(i) ? d.weeklyOff.filter((x) => x !== i) : [...d.weeklyOff, i] }));

  return (
    <div style={{ padding: "8px 0", borderBottom: "1px solid var(--line)" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13.5, gap: 8, flexWrap: "wrap" }}>
        {editing ? (
          <div style={{ display: "flex", gap: 6, flex: 1, flexWrap: "wrap" }}>
            <input autoFocus value={draft.name} onChange={(e) => setDraft((d) => ({ ...d, name: e.target.value }))}
              placeholder="Location name" style={{ ...inputStyle, padding: "5px 8px", fontSize: 13, flex: 1, minWidth: 100 }} />
            <input type="time" value={draft.shiftStart} onChange={(e) => setDraft((d) => ({ ...d, shiftStart: e.target.value }))}
              style={{ ...inputStyle, padding: "5px 8px", fontSize: 13, width: 100 }} />
            <input type="number" min="0" value={draft.graceMinutes} onChange={(e) => setDraft((d) => ({ ...d, graceMinutes: e.target.value }))}
              placeholder="Grace min" style={{ ...inputStyle, padding: "5px 8px", fontSize: 13, width: 80 }} />
          </div>
        ) : (
          <span style={{ flex: 1 }}>
            {loc.name}
            <span style={{ fontSize: 11, color: "var(--ink-soft)", marginLeft: 6 }}>· shift {loc.shiftStart || "09:00"} · {loc.graceMinutes ?? 0} min grace{loc.weeklyOff && loc.weeklyOff.length > 0 ? ` · off ${loc.weeklyOff.slice().sort().map((i) => DAY_NAMES[i]).join(", ")}` : ""}</span>
          </span>
        )}
        <div style={{ display: "flex", gap: 4, flexShrink: 0 }}>
          {editing ? (
            <button onClick={save} style={{ ...ghostBtn, padding: "4px 8px", fontSize: 11 }}>Save</button>
          ) : (
            <button onClick={() => { setDraft({ name: loc.name, shiftStart: loc.shiftStart || "09:00", graceMinutes: loc.graceMinutes ?? 0, weeklyOff: loc.weeklyOff || [] }); setEditing(true); }} style={{ ...ghostBtn, padding: "4px 8px", fontSize: 11 }}>Edit</button>
          )}
          <button onClick={() => setConfirmingRemove((v) => !v)} style={{ ...ghostBtn, padding: "4px 8px", fontSize: 11, borderColor: "var(--rejected)", color: "var(--rejected)" }}>Remove</button>
        </div>
      </div>
      {editing && (
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 8, flexWrap: "wrap" }}>
          <span style={{ fontSize: 11, color: "var(--ink-soft)" }}>Weekly off:</span>
          {DAY_NAMES.map((d, i) => (
            <button key={i} type="button" onClick={() => toggleDay(i)}
              style={{ ...ghostBtn, padding: "4px 9px", fontSize: 11, background: draft.weeklyOff.includes(i) ? "var(--ink)" : "var(--card)", color: draft.weeklyOff.includes(i) ? "var(--paper)" : "var(--ink)" }}>{d}</button>
          ))}
        </div>
      )}
      {confirmingRemove && (
        <div style={{ display: "flex", gap: 6, alignItems: "center", marginTop: 6, flexWrap: "wrap" }}>
          <span style={{ fontSize: 11.5, color: "var(--rejected)" }}>Delete "{loc.name}" and its {myRouters.length} router{myRouters.length === 1 ? "" : "s"}? This can't be undone.</span>
          <button onClick={() => { onRemove(loc.id); setConfirmingRemove(false); }} style={{ ...ghostBtn, padding: "4px 10px", fontSize: 11, borderColor: "var(--rejected)", color: "var(--rejected)" }}>Yes, delete</button>
          <button onClick={() => setConfirmingRemove(false)} style={{ ...ghostBtn, padding: "4px 10px", fontSize: 11 }}>Cancel</button>
        </div>
      )}
      <div style={{ marginTop: 8, padding: "8px 10px", background: "var(--paper-dark)", borderRadius: 8 }}>
        <div style={{ fontSize: 10.5, color: "var(--ink-soft)", marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.04em" }}>Routers ({myRouters.length})</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center" }}>
          {myRouters.map((r) => (
            <span key={r.id} style={{ fontSize: 11, padding: "4px 9px", borderRadius: 6, background: "var(--card)", border: "1px solid var(--line)", fontFamily: "'IBM Plex Mono', monospace", display: "flex", alignItems: "center", gap: 6 }}>
              {r.ssid} · {r.bssid}
              <span onClick={() => onRemoveRouter(r.id)} style={{ cursor: "pointer", color: "var(--rejected)", fontWeight: 700 }} title="Remove router">×</span>
            </span>
          ))}
          <input value={newSsid} onChange={(e) => setNewSsid(e.target.value)} placeholder="SSID" style={{ ...inputStyle, padding: "5px 8px", fontSize: 11.5, width: 90 }} />
          <input value={newBssid} onChange={(e) => setNewBssid(e.target.value)} placeholder="BSSID (MAC address)" style={{ ...inputStyle, padding: "5px 8px", fontSize: 11.5, width: 150 }} />
          <button onClick={() => { if (newSsid.trim() && newBssid.trim()) { onAddRouter(loc.id, newSsid, newBssid); setNewSsid(""); setNewBssid(""); } }}
            style={{ ...ghostBtn, padding: "5px 10px", fontSize: 11 }}>+ Add router</button>
        </div>
        <div style={{ fontSize: 10.5, color: "var(--ink-soft)", marginTop: 6 }}>Manual entry for now — the Android app will get a scan-and-detect option later.</div>
      </div>
    </div>
  );
}

    if (!navigator.clipboard) return;
    navigator.clipboard.writeText(text).then(() => {
      setCopied(label);
      setTimeout(() => setCopied(""), 1500);
    }).catch(() => {});

  const role = staffRole(s);
  const isMe = s.uid === myUid;
  const grantedCount = s.allowedCategories ? Object.keys(s.allowedCategories).length : 0;

    <div style={{ padding: "8px 0", borderBottom: "1px solid var(--line)" }}>

          <div>{s.name} {isMe && <span style={{ fontSize: 11, color: "var(--ink-soft)" }}>(you)</span>}</div>

              <span onClick={() => onSendResetLink(s.email)} style={{ fontSize: 10.5, color: "var(--paid)", cursor: "pointer", textDecoration: "underline" }}>

        <label style={{ fontSize: 11.5, color: "var(--ink-soft)", display: "flex", alignItems: "center", gap: 4 }}>

function ExpenseSettings({ categories, onAddCategory, onRemoveCategory, onRenameCategory, onMoveCategory, onMergeCategory, categoryUsageCount, onToggleCategoryHidden, tags, onRemoveTag, onRenameTag, onMergeTag, tagUsageCount, onSetTagDefaultCategory }) {

    .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));

  return (
    <div style={{ display: "grid", gap: 20 }}>

          {categories.length > 0 && filteredCategories.length === 0 && <div style={{ color: "var(--ink-soft)", fontSize: 13 }}>No categories match "{catSearch}".</div>}
          {filteredCategories.map((c) => {
            const i = categories.findIndex((x) => x.id === c.id);

                  </label>

            );
          })}
        </div>
      </CollapsibleCard>

      <CollapsibleCard storageKey="tags" title="Tags"
        subtitle="Tags are added automatically when staff type a new item on a claim. Sorted by how often they're used — rarely-used ones near the bottom are worth a look for typos, and can be merged into an existing tag. Set a default category so staff don't have to pick it themselves — they can still change it manually.">

        )}

          {tags.length === 0 && <div style={{ color: "var(--ink-soft)", fontSize: 13 }}>No tags yet — they'll appear here once staff start logging items.</div>}
          {tags.length > 0 && filteredTags.length === 0 && <div style={{ color: "var(--ink-soft)", fontSize: 13 }}>No tags match "{tagSearch}".</div>}
          {filteredTags.map((t) => (
            <EditableRow key={t.id} name={t.name}
              meta={`· ${t.count} use${t.count === 1 ? "" : "s"}`}
              onRename={(newName) => onRenameTag(t.id, t.name, newName)}
              onRemove={() => onRemoveTag(t.id, t.name)}
              mergeOptions={tags.filter((x) => x.id !== t.id).map((x) => x.name)}
              onMerge={(target) => onMergeTag(t.id, t.name, target)}

                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>

          ))}
        </div>
      </CollapsibleCard>
    </div>
  );
}

const PROFILE_FIELDS = ["name", "staffCode", "phone", "designation", "joinDate", "department", "employmentType", "emergencyName", "emergencyPhone", "bloodGroup", "dob", "tempAddress", "permanentAddress", "photo"];
const PROFILE_LABELS = {
  name: "Full name", staffCode: "Staff code", phone: "Phone", designation: "Designation", joinDate: "Date of joining",
  department: "Department", employmentType: "Employment type", emergencyName: "Emergency contact name",
  emergencyPhone: "Emergency contact phone", bloodGroup: "Blood group", dob: "Date of birth", tempAddress: "Temporary address",
  permanentAddress: "Permanent address", photo: "Photo",
};
// Fields only a Super Admin or Admin sets — not editable from the employee's own profile form.
const ADMIN_PROFILE_FIELDS = ["staffCode", "designation", "department"];
const ADMIN_PROFILE_LABELS = { staffCode: "Staff code", designation: "Designation", department: "Department" };
const SENSITIVE_FIELDS = ["bankName", "branchName", "bankAccount", "citizenshipNumber", "panNumber", "citizenshipImage", "panImage"];
const SENSITIVE_LABELS = {
  bankName: "Bank name", branchName: "Branch name", bankAccount: "Bank account number", citizenshipNumber: "Citizenship number",
  panNumber: "PAN number", citizenshipImage: "Citizenship document", panImage: "PAN document",
};
function diffFields(oldObj, newObj, fields, labels) {
  const changes = [];
  fields.forEach((f) => {
    const before = (oldObj && oldObj[f]) || "";
    const after = (newObj && newObj[f]) || "";
    if (before !== after) {
      const isImage = typeof after === "string" && after.startsWith("data:image");
      changes.push({ field: f, label: labels[f] || f, from: isImage ? (before ? "(previous file)" : "") : before, to: isImage ? (after ? "(new file uploaded)" : "") : after });
    }
  });
  return changes;
}

// ---------- Team: read-only availability view for everyone (name, department,
// status only — no GPS, times, or check-in/out actions; those stay admin-only
// in Team Attendance). Always shows today only — no browsing past dates.
function TeamAvailability({ allAttendance, staffMap, locations, dateFormat }) {
  const today = localDateKey();
  const dayRecords = allAttendance.filter((a) => a.date === today);
  const staffList = Object.entries(staffMap || {}).filter(([, s]) => s.active !== false).map(([uid, s]) => ({ uid, ...s }));
  const todayDow = new Date(today + "T00:00:00").getDay();
  const isWeeklyOff = (s) => {
    const loc = s.locationId ? locations.find((l) => l.id === s.locationId) : null;
    return !!(loc && loc.weeklyOff && loc.weeklyOff.includes(todayDow));
  };

  const rows = staffList.map((s) => {
    const rec = dayRecords.find((a) => a.staffUid === s.uid);
    const status = rec ? rec.status : (isWeeklyOff(s) ? "week_off" : "absent");
    return { s, status };
  }).sort((a, b) => {
    const order = { absent: 0, awaiting_checkin: 1, late: 2, half_day: 3, on_leave: 4, week_off: 5, present: 6 };
    const oa = order[a.status] ?? 7, ob = order[b.status] ?? 7;
    return oa !== ob ? oa - ob : a.s.name.localeCompare(b.s.name);
  });

  return (
    <div style={{ display: "grid", gap: 16 }}>
      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 8 }}>
          <div style={{ fontFamily: "'Lora', serif", fontSize: 16, fontWeight: 600 }}>Team</div>
          <div style={{ fontSize: 12.5, color: "var(--ink-soft)" }}>{fmtDate(today, dateFormat)}</div>
        </div>
        <div style={{ display: "grid", gap: 2 }}>
          {rows.length === 0 && <div style={{ color: "var(--ink-soft)", fontSize: 13 }}>No active staff.</div>}
          {rows.map(({ s, status }) => (
            <div key={s.uid} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "9px 0", borderBottom: "1px solid var(--line)" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                {s.photo ? (
                  <img src={s.photo} alt={s.name} style={{ width: 30, height: 30, borderRadius: "50%", objectFit: "cover", border: "1px solid var(--line)" }} />
                ) : (
                  <div style={{ width: 30, height: 30, borderRadius: "50%", background: "var(--paper)", border: "1px solid var(--line)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12.5, fontFamily: "'Lora', serif", color: "var(--ink-soft)", flexShrink: 0 }}>{(s.name || "?")[0]}</div>
                )}
                <div>
                  <span style={{ fontSize: 13.5 }}>{s.name}</span>
                  {s.department && <span style={{ fontSize: 11.5, color: "var(--ink-soft)", marginLeft: 6 }}>{s.department}</span>}
                </div>
              </div>
              <StatusBadge status={status} metaMap={ATT_STATUS_META} />
            </div>
          ))}
        </div>
      </Card>
    </div>
  );
}

                  <div style={{ display: "flex", gap: 6 }}>
                    <button onClick={() => onApproveRequest(a.staffUid, a.date)} style={{ ...ghostBtn, padding: "6px 10px", fontSize: 11.5, borderColor: "var(--approved)", color: "var(--approved)" }}>Approve</button>
                    <button onClick={() => onRejectRequest(a.staffUid, a.date)} style={{ ...ghostBtn, padding: "6px 10px", fontSize: 11.5, borderColor: "var(--rejected)", color: "var(--rejected)" }}>Reject</button>
                  </div>
                </div>
              );
            })}
          </div>
        </Card>
      )}
      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 8 }}>
          <div style={{ fontFamily: "'Lora', serif", fontSize: 16, fontWeight: 600 }}>Team attendance</div>
          <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
            <label style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 12, color: "var(--no-checkout)", cursor: "pointer" }}>
              <input type="checkbox" checked={onlyNoCheckout} onChange={(e) => setOnlyNoCheckout(e.target.checked)} />
              Not checked out only
            </label>
            <input type="date" value={selDate} onChange={(e) => setSelDate(e.target.value)} style={{ ...inputStyle, width: "auto" }} />
          </div>
        </div>
        <div style={{ display: "grid", gap: 2 }}>
          {staffList.length === 0 && <div style={{ color: "var(--ink-soft)", fontSize: 13 }}>No active staff.</div>}
          {staffList
            .map((s) => {
              const rec = dayRecords.find((a) => a.staffUid === s.uid);
              const status = rec ? rec.status : (isWeeklyOff(s) ? "week_off" : "absent");
              const noCheckout = ["present", "late", "half_day"].includes(status) && rec && rec.checkInTime && !rec.checkOutTime;
              return { s, rec, status, noCheckout };
            })
            .filter((r) => !onlyNoCheckout || r.noCheckout)
            .sort((a, b) => {
              const order = { absent: 0, awaiting_checkin: 1, late: 2, half_day: 3, on_leave: 4, week_off: 5, present: 6 };
              const oa = order[a.status] ?? 7, ob = order[b.status] ?? 7;
              if (a.noCheckout !== b.noCheckout) return a.noCheckout ? -1 : 1;
              return oa !== ob ? oa - ob : a.s.name.localeCompare(b.s.name);
            })
            .map(({ s, rec, status, noCheckout }) => {
            return (
              <div key={s.uid} style={{ padding: "8px 0", borderBottom: "1px solid var(--line)", background: noCheckout ? "rgba(193,68,14,0.06)" : "transparent" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13.5, gap: 8, flexWrap: "wrap" }}>
                  <div>
                    <span>{s.name}</span>
                    <span style={{ fontSize: 11, color: "var(--ink-soft)", marginLeft: 6 }}>{locName(s.locationId)}</span>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    {rec && rec.checkInTime && <span style={{ fontSize: 11.5, color: "var(--ink-soft)" }}>{fmtTimeLabel(rec.checkInTime)}{rec.checkOutTime ? " – " + fmtTimeLabel(rec.checkOutTime) : ""}</span>}
                    {noCheckout && <span style={{ fontSize: 10.5, fontWeight: 600, color: "var(--no-checkout)", border: "1px solid var(--no-checkout)", borderRadius: 999, padding: "2px 8px" }}>No checkout</span>}
                    <StatusBadge status={status} metaMap={ATT_STATUS_META} />
                  </div>
                </div>
                {rec && (rec.geoLat != null || rec.checkOutGeoLat != null) && (
                  <div style={{ display: "flex", gap: 12, marginTop: 4 }}>
                    <MapLink lat={rec.geoLat} lng={rec.geoLng} label="View check-in location" />
                    <MapLink lat={rec.checkOutGeoLat} lng={rec.checkOutGeoLng} label="View check-out location" />
                  </div>
                )}
                {rec && rec.lateRemark && <div style={{ fontSize: 11.5, color: "var(--ink-soft)", fontStyle: "italic", marginTop: 3 }}>"{rec.lateRemark}"</div>}
              </div>
            );
          })}
        </div>
      </Card>
    </div>
  );
}
