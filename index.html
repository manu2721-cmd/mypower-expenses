// ---------- Reusable month-calendar for a single staff's attendance. Days with
// no record are shown as Week Off (if the location's weekly-off covers that
// weekday) or Absent, matching the same rule used elsewhere. Future days are
// left blank. Tapping a day shows its check-in/out time and any late remark.
// Tint (light background) + solid text/border pair for each status, so calendar
// day cells can be fully colored while staying readable. Keys match ATT_STATUS_META.
const ATT_CELL_TINT = {
  present: { bg: "rgba(42,106,90,0.16)", fg: "#2A6A5A" },
  late: { bg: "rgba(181,118,43,0.18)", fg: "#B5762B" },
  half_day: { bg: "rgba(47,59,82,0.14)", fg: "#2F3B52" },
  absent: { bg: "rgba(140,59,59,0.16)", fg: "#8C3B3B" },
  awaiting_checkin: { bg: "rgba(181,118,43,0.18)", fg: "#B5762B" },
  on_leave: { bg: "rgba(122,111,176,0.18)", fg: "#7A6FB0" },
  week_off: { bg: "rgba(136,135,128,0.14)", fg: "#6B6A64" },
  wfh: { bg: "rgba(62,124,177,0.16)", fg: "#3E7CB1" },
};
const ATT_CELL_CODE = {
  present: "Pres",
  late: "Late",
  half_day: "HD",
  absent: "Abs",
  awaiting_checkin: "Await",
  on_leave: "Leave",
  week_off: "WO",
  wfh: "WFH",
};

const BS_MONTH_NAMES = ["Baisakh", "Jestha", "Asar", "Shrawan", "Bhadra", "Aswin", "Kartik", "Mangsir", "Poush", "Magh", "Falgun", "Chaitra"];
const AD_MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

// Finds the AD "YYYY-MM-DD" range a given BS year+month (0-based) spans, by
// walking day-by-day from its first day until the BS month changes — robust
// regardless of variable BS month lengths. Returns null if the date library
// isn't available or the year is outside its supported range.
function getBsMonthRange(bsYear, bsMonthIdx) {
  const NDClass = (typeof NepaliDate !== "undefined" && NepaliDate && NepaliDate.default) ? NepaliDate.default : null;
  if (!NDClass) return null;
  try {
    const localKeyOf = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    const cursor = new Date(new NDClass(bsYear, bsMonthIdx, 1).toJsDate());
    const fromKey = localKeyOf(cursor);
    let toKey = fromKey;
    let guard = 0;
    while (guard++ < 35) {
      const next = new Date(cursor);
      next.setDate(next.getDate() + 1);
      const nd = new NDClass(next);
      if (nd.getYear() !== bsYear || nd.getMonth() !== bsMonthIdx) break;
      cursor.setDate(cursor.getDate() + 1);
      toKey = localKeyOf(cursor);
    }
    return { from: fromKey, to: toKey };
  } catch (e) {
    return null;
  }
}
// Given a history list of {..., effectiveFrom}, finds the entry with the latest
// effectiveFrom that is on or before asOfDate — i.e. "what applied as of this date."
function getEffectiveEntry(history, asOfDate) {
  const applicable = (history || []).filter((h) => h.effectiveFrom && h.effectiveFrom <= asOfDate);
  if (applicable.length === 0) return null;
  applicable.sort((a, b) => b.effectiveFrom.localeCompare(a.effectiveFrom));
  return applicable[0];
}

function MonthCalendar({ records, weeklyOff, dateFormat }) {
  const [monthOffset, setMonthOffset] = useState(0);
  const [selectedDay, setSelectedDay] = useState(null);
  const isBS = dateFormat === "BS";
  const NDClass = (typeof NepaliDate !== "undefined" && NepaliDate && NepaliDate.default) ? NepaliDate.default : null;
  const todayKey = localDateKey();

  const recByDate = {};
  (records || []).forEach((r) => { recByDate[r.date] = r; });
  const localKeyOf = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

  // cells: [{ dayLabel, adKey } | null, ...] — adKey is always the real AD
  // "YYYY-MM-DD" that attendance is stored under; dayLabel is what's shown
  // in the box (AD day number, or BS day number when the BS toggle is on).
  let cells = [];
  let monthLabel = "";
  let atLatestMonth = monthOffset >= 0;
  let bsFailed = false;

  if (isBS && NDClass) {
    try {
      const todayNd = new NDClass(new Date());
      let bsY = todayNd.getYear(), bsM = todayNd.getMonth() + monthOffset;
      while (bsM < 0) { bsM += 12; bsY -= 1; }
      while (bsM > 11) { bsM -= 12; bsY += 1; }
      atLatestMonth = bsY === todayNd.getYear() && bsM === todayNd.getMonth();
      monthLabel = `${BS_MONTH_NAMES[bsM]} ${bsY}`;
      const firstAd = new NDClass(bsY, bsM, 1).toJsDate();
      const cursor = new Date(firstAd);
      const firstDow = cursor.getDay();
      for (let i = 0; i < firstDow; i++) cells.push(null);
      let guard = 0;
      while (guard++ < 35) {
        const nd = new NDClass(cursor);
        if (nd.getYear() !== bsY || nd.getMonth() !== bsM) break;
        cells.push({ dayLabel: nd.getDate(), adKey: localKeyOf(cursor), dow: cursor.getDay() });
        cursor.setDate(cursor.getDate() + 1);
      }
    } catch (err) {
      bsFailed = true;
      cells = [];
    }
  }
  if (!isBS || !NDClass || bsFailed) {
    const base = new Date();
    base.setDate(1);
    base.setMonth(base.getMonth() + monthOffset);
    const year = base.getFullYear();
    const month = base.getMonth();
    const firstDow = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    monthLabel = base.toLocaleDateString("en-US", { month: "long", year: "numeric" });
    for (let i = 0; i < firstDow; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) {
      const adKey = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      cells.push({ dayLabel: d, adKey, dow: new Date(adKey + "T00:00:00").getDay() });
    }
  }

  const statusFor = (adKey, dow) => {
    if (recByDate[adKey]) return recByDate[adKey].status;
    if (adKey > todayKey) return null;
    if (weeklyOff && weeklyOff.includes(dow)) return "week_off";
    return "absent";
  };

  const selRec = selectedDay ? recByDate[selectedDay] : null;
  const selCell = selectedDay ? cells.find((c) => c && c.adKey === selectedDay) : null;
  const selStatus = selCell ? statusFor(selCell.adKey, selCell.dow) : null;

  return (
    <div>
      {isBS && (!NDClass || bsFailed) && <div style={{ fontSize: 11.5, color: "var(--rejected)", marginBottom: 8 }}>Nepali calendar isn't available for this month — showing AD instead.</div>}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <button onClick={() => { setMonthOffset((m) => m - 1); setSelectedDay(null); }} style={{ ...ghostBtn, padding: "5px 10px" }}>←</button>
        <div style={{ fontWeight: 600, fontSize: 14 }}>{monthLabel}</div>
        <button onClick={() => { setMonthOffset((m) => m + 1); setSelectedDay(null); }} disabled={atLatestMonth}
          style={{ ...ghostBtn, padding: "5px 10px", opacity: atLatestMonth ? 0.35 : 1, cursor: atLatestMonth ? "not-allowed" : "pointer" }}>→</button>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, textAlign: "center", fontSize: 10.5, color: "var(--ink-soft)", marginBottom: 4 }}>
        {["S", "M", "T", "W", "T", "F", "S"].map((d, i) => <span key={i}>{d}</span>)}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4 }}>
        {cells.map((cell, i) => {
          if (!cell) return <div key={i} />;
          const status = statusFor(cell.adKey, cell.dow);
          const tint = status ? ATT_CELL_TINT[status] : null;
          const isToday = cell.adKey === todayKey;
          const rec = recByDate[cell.adKey];
          const noCheckout = ["present", "late"].includes(status) && rec && rec.checkInTime && !rec.checkOutTime;
          const code = status ? ATT_CELL_CODE[status] : "";
          return (
            <button key={i} onClick={() => setSelectedDay(cell.adKey === selectedDay ? null : cell.adKey)}
              style={{ aspectRatio: "1", borderRadius: 8, border: isToday ? "2px solid var(--ink)" : selectedDay === cell.adKey ? "1.5px solid var(--brand-yellow)" : "1px solid var(--line)",
                background: tint ? tint.bg : "var(--card)", color: tint ? tint.fg : "var(--ink)", fontWeight: tint ? 600 : 400,
                display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4,
                cursor: "pointer", padding: 0 }}>
              <span style={{ fontSize: 12.5 }}>{cell.dayLabel}</span>
              {code && (
                <span style={{ fontSize: 8.5, fontWeight: 500, whiteSpace: "nowrap" }}>
                  <span style={{ opacity: 0.85 }}>{code}</span>{noCheckout && <span style={{ color: "var(--no-checkout)" }}>·NC</span>}
                </span>
              )}
            </button>
          );
        })}
      </div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 12, fontSize: 10.5, color: "var(--ink-soft)" }}>
        {Object.entries(ATT_STATUS_META).map(([k, v]) => (
          <span key={k}><span style={{ display: "inline-block", width: 7, height: 7, borderRadius: "50%", background: v.color, marginRight: 3 }} />{v.label}</span>
        ))}
      </div>
      {selectedDay && (
        <div style={{ marginTop: 10, padding: 10, background: "var(--paper)", borderRadius: 8, fontSize: 12.5 }}>
          <div style={{ fontWeight: 600 }}>{fmtDate(selectedDay, dateFormat)}</div>
          {selRec ? (
            <>
              <div style={{ color: "var(--ink-soft)", marginTop: 2 }}>
                {selRec.checkInTime ? fmtTimeLabel(selRec.checkInTime) : "—"}{selRec.checkOutTime ? " – " + fmtTimeLabel(selRec.checkOutTime) : ""}
              </div>
              {selRec.lateRemark && <div style={{ fontStyle: "italic", color: "var(--ink-soft)", marginTop: 4 }}>"{selRec.lateRemark}"</div>}
            </>
          ) : (
            <div style={{ color: "var(--ink-soft)", marginTop: 2 }}>{selStatus === "week_off" ? "Week off" : selStatus === "absent" ? "No record" : "—"}</div>
          )}
        </div>
      )}
    </div>
  );
}

function AttendanceTab({ me, myAttendance, location, onCheckIn, onRequestCheckIn, onCancelRequest, onCheckOut, onSaveRemark, onMarkWfh, attBusy, attError, dateFormat }) {
  const [note, setNote] = useState("");
  const [requesting, setRequesting] = useState(false);
  const [markingWfh, setMarkingWfh] = useState(false);
  const [wfhNote, setWfhNote] = useState("");
  const [halfDayToggle, setHalfDayToggle] = useState(false);
  const [historyView, setHistoryView] = useState("list");
  const dateKey = localDateKey();
  const today = myAttendance.find((a) => a.date === dateKey);

  return (
    <div style={{ display: "grid", gap: 20 }}>
      <Card style={{ maxWidth: 480 }}>
        <div style={{ fontFamily: "'Lora', serif", fontSize: 18, fontWeight: 600, marginBottom: 2 }}>Attendance</div>
        <div style={{ fontSize: 12.5, color: "var(--ink-soft)", marginBottom: 14 }}>{location ? location.name : "No location assigned"}</div>

        {!today && (
          <div>
            <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 10 }}>Not checked in yet</div>
            {!requesting && !markingWfh ? (
              <div>
                <button onClick={onCheckIn} disabled={attBusy}
                  style={{ width: "100%", padding: 13, borderRadius: 8, border: "none", background: "var(--brand-yellow)", color: "var(--ink)", fontWeight: 600, fontSize: 14, cursor: attBusy ? "default" : "pointer" }}>
                  {attBusy ? "Getting your location…" : "Check in"}
                </button>
                {me.wfhAllowed && <button onClick={() => setMarkingWfh(true)} style={{ ...ghostBtn, marginTop: 8, width: "100%" }}>Mark Work From Home today</button>}
                <button onClick={() => setRequesting(true)} style={{ ...ghostBtn, marginTop: 8, width: "100%", fontSize: 12 }}>Trouble checking in? Request check-in instead</button>
              </div>
            ) : markingWfh ? (
              <div style={{ display: "grid", gap: 8 }}>
                <input value={wfhNote} onChange={(e) => setWfhNote(e.target.value)} placeholder="Reason (optional)" style={inputStyle} />
                <div style={{ display: "flex", gap: 8 }}>
                  <button onClick={() => { onMarkWfh(wfhNote); setMarkingWfh(false); setWfhNote(""); }} disabled={attBusy} style={{ ...ghostBtn, flex: 1 }}>{attBusy ? "Saving…" : "Confirm WFH"}</button>
                  <button onClick={() => setMarkingWfh(false)} style={ghostBtn}>Cancel</button>
                </div>
              </div>
            ) : (
              <div style={{ display: "grid", gap: 8 }}>
                <input value={note} onChange={(e) => setNote(e.target.value)} placeholder="Note (e.g. GPS not working)" style={inputStyle} />
                <div style={{ display: "flex", gap: 8 }}>
                  <button onClick={() => { onRequestCheckIn(note); setRequesting(false); setNote(""); }} disabled={attBusy} style={{ ...ghostBtn, flex: 1 }}>{attBusy ? "Sending…" : "Send request"}</button>
                  <button onClick={() => setRequesting(false)} style={ghostBtn}>Cancel</button>
                </div>
              </div>
            )}
            {attError && <div style={{ fontSize: 12, color: "var(--rejected)", marginTop: 8 }}>{attError}</div>}
          </div>
        )}

        {today && today.status === "awaiting_checkin" && (
          <div>
            <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 6 }}>Check-in request sent</div>
            {today.requestNote && <div style={{ fontSize: 12.5, color: "var(--ink-soft)", marginBottom: 8, fontStyle: "italic" }}>"{today.requestNote}"</div>}
            <div style={{ fontSize: 12, color: "var(--ink-soft)", marginBottom: 10 }}>Waiting for an admin to check you in.</div>
            <button onClick={onCancelRequest} style={ghostBtn}>Withdraw request</button>
          </div>
        )}

        {today && today.status === "wfh" && (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4, gap: 8, flexWrap: "wrap" }}>
              <div style={{ fontSize: 14, fontWeight: 600 }}>Marked Work From Home</div>
              <StatusBadge status="wfh" metaMap={ATT_STATUS_META} />
            </div>
            <div style={{ fontSize: 12, color: "var(--ink-soft)" }}>Since {fmtTimeLabel(today.checkInTime)} — no checkout needed for WFH days.</div>
            {today.note && <div style={{ fontSize: 12, color: "var(--ink-soft)", fontStyle: "italic", marginTop: 4 }}>"{today.note}"</div>}
          </div>
        )}

        {today && today.status !== "wfh" && today.checkInTime && !today.checkOutTime && (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4, gap: 8, flexWrap: "wrap" }}>
              <div style={{ fontSize: 14, fontWeight: 600 }}>Checked in at {fmtTimeLabel(today.checkInTime)}</div>
              <StatusBadge status={today.status} metaMap={ATT_STATUS_META} />
            </div>
            {today.checkedInBy && today.checkedInBy !== "self" && <div style={{ fontSize: 11.5, color: "var(--ink-soft)", marginBottom: 6 }}>Checked in by {today.checkedInBy}</div>}
            <MapLink lat={today.geoLat} lng={today.geoLng} label="View my check-in location" />
            {["late", "half_day"].includes(today.status) && <LateRemarkBox remark={today.lateRemark} onSave={(text) => onSaveRemark(dateKey, text)} />}
            <label style={{ fontSize: 12.5, display: "flex", alignItems: "center", gap: 6, margin: "10px 0" }}>
              <input type="checkbox" checked={halfDayToggle} onChange={(e) => setHalfDayToggle(e.target.checked)} /> Leaving early — mark half day
            </label>
            <button onClick={() => onCheckOut(halfDayToggle)} disabled={attBusy} style={{ ...ghostBtn, width: "100%" }}>{attBusy ? "Checking out…" : "Check out"}</button>
          </div>
        )}

        {today && today.checkInTime && today.checkOutTime && (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
              <div style={{ fontSize: 14, fontWeight: 600 }}>{fmtTimeLabel(today.checkInTime)} – {fmtTimeLabel(today.checkOutTime)}</div>
              <StatusBadge status={today.status} metaMap={ATT_STATUS_META} />
            </div>
            {["late", "half_day"].includes(today.status) && <LateRemarkBox remark={today.lateRemark} onSave={(text) => onSaveRemark(dateKey, text)} />}
          </div>
        )}
      </Card>

      <Card style={{ maxWidth: 480 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, flexWrap: "wrap", gap: 8 }}>
          <div style={{ fontFamily: "'Lora', serif", fontSize: 15, fontWeight: 600 }}>{historyView === "calendar" ? "Calendar" : "Recent history"}</div>
          <div style={{ display: "flex", gap: 6 }}>
            <button onClick={() => setHistoryView("list")} style={{ ...ghostBtn, padding: "5px 10px", fontSize: 11.5, background: historyView === "list" ? "var(--ink)" : "var(--card)", color: historyView === "list" ? "var(--paper)" : "var(--ink)" }}>List</button>
            <button onClick={() => setHistoryView("calendar")} style={{ ...ghostBtn, padding: "5px 10px", fontSize: 11.5, background: historyView === "calendar" ? "var(--ink)" : "var(--card)", color: historyView === "calendar" ? "var(--paper)" : "var(--ink)" }}>Calendar</button>
          </div>
        </div>
        {historyView === "calendar" ? (
          <MonthCalendar records={myAttendance} weeklyOff={location && location.weeklyOff} dateFormat={dateFormat} />
        ) : (
          <div style={{ display: "grid", gap: 8 }}>
            {myAttendance.length === 0 && <div style={{ fontSize: 13, color: "var(--ink-soft)" }}>No attendance recorded yet.</div>}
            {myAttendance.slice(0, 14).map((a) => (
              <div key={a.date} style={{ background: "var(--card)", border: "1px solid var(--line)", borderRadius: 10, padding: "10px 12px", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                <div>
                  <div style={{ fontSize: 13.5, fontWeight: 600 }}>{fmtDate(a.date, dateFormat)}</div>
                  <div style={{ fontSize: 11.5, color: "var(--ink-soft)", marginTop: 2 }}>
                    {a.checkInTime ? `${fmtTimeLabel(a.checkInTime)}${a.checkOutTime ? " – " + fmtTimeLabel(a.checkOutTime) : ""}` : "No check-in time"}
                  </div>
                  {(a.geoLat != null || a.checkOutGeoLat != null) && (
                    <div style={{ display: "flex", gap: 10, marginTop: 3 }}>
                      <MapLink lat={a.geoLat} lng={a.geoLng} label="Check-in location" />
                      <MapLink lat={a.checkOutGeoLat} lng={a.checkOutGeoLng} label="Check-out location" />
                    </div>
                  )}
                  {a.lateRemark && <div style={{ fontSize: 11.5, color: "var(--ink-soft)", fontStyle: "italic", marginTop: 3 }}>"{a.lateRemark}"</div>}
                </div>
                <StatusBadge status={a.status} metaMap={ATT_STATUS_META} />
              </div>
            ))}
          </div>
        )}
      </Card>
    </div>
  );
}

function LeaveTab({ me, myLeaveRequests, dateFormat, onSubmit, onWithdraw, busy }) {
  const [type, setType] = useState("sick");
  const [fromDate, setFromDate] = useState(todayStr());
  const [toDate, setToDate] = useState(todayStr());
  const [halfDay, setHalfDay] = useState(false);
  const [note, setNote] = useState("");

  const allotted = (me.leaveAllotted && me.leaveAllotted[type]) || 0;
  const usedForType = (t) => myLeaveRequests.filter((r) => r.type === t && r.status === "Approved").reduce((sum, r) => sum + (r.days || 0), 0);
  const days = countLeaveDays(fromDate, toDate, halfDay);

  const submit = () => {
    if (days <= 0) return;
    onSubmit({ type, fromDate, toDate, halfDay, days, note: note.trim() });
    setNote(""); setHalfDay(false);
  };

  return (
    <div style={{ display: "grid", gap: 20 }}>
      <Card style={{ maxWidth: 480 }}>
        <div style={{ fontFamily: "'Lora', serif", fontSize: 18, fontWeight: 600, marginBottom: 14 }}>Request leave</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
          {LEAVE_TYPES.map((lt) => (
            <button key={lt.id} onClick={() => setType(lt.id)} style={{
              padding: "6px 13px", borderRadius: 999, fontSize: 12, fontWeight: 600, cursor: "pointer",
              border: "1.5px solid " + (type === lt.id ? "var(--brand-yellow)" : "var(--line)"),
              background: type === lt.id ? "var(--brand-yellow)" : "var(--card)", color: "var(--ink)",
            }}>{lt.label}</button>
          ))}
        </div>
        <div style={{ fontSize: 12, color: "var(--ink-soft)", marginBottom: 14 }}>
          Balance: <b style={{ color: "var(--approved)" }}>{Math.max(allotted - usedForType(type), 0)}</b> of {allotted} days left this year
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <Field label="From"><input type="date" value={fromDate} onChange={(e) => setFromDate(e.target.value)} style={inputStyle} /></Field>
          <Field label="To"><input type="date" value={toDate} onChange={(e) => setToDate(e.target.value)} style={inputStyle} /></Field>
        </div>
        {fromDate === toDate && (
          <label style={{ fontSize: 12.5, display: "flex", alignItems: "center", gap: 6, margin: "10px 0" }}>
            <input type="checkbox" checked={halfDay} onChange={(e) => setHalfDay(e.target.checked)} /> Half day
          </label>
        )}
        <Field label="Note (optional)"><textarea value={note} onChange={(e) => setNote(e.target.value)} rows={2} style={{ ...inputStyle, resize: "vertical" }} /></Field>
        <div style={{ fontSize: 12, color: "var(--ink-soft)", margin: "8px 0" }}>{days > 0 ? `${days} day${days === 1 ? "" : "s"}` : "Pick valid dates"}</div>
        <button onClick={submit} disabled={busy || days <= 0} style={{ width: "100%", padding: 13, borderRadius: 8, border: "none", background: "var(--brand-yellow)", color: "var(--ink)", fontWeight: 600, fontSize: 14, cursor: busy ? "default" : "pointer" }}>
          {busy ? "Submitting…" : "Submit request"}
        </button>
      </Card>

      <Card style={{ maxWidth: 480 }}>
        <div style={{ fontFamily: "'Lora', serif", fontSize: 15, fontWeight: 600, marginBottom: 12 }}>My requests</div>
        <div style={{ display: "grid", gap: 8 }}>
          {myLeaveRequests.length === 0 && <div style={{ fontSize: 13, color: "var(--ink-soft)" }}>No leave requested yet.</div>}
          {myLeaveRequests.map((r) => (
            <div key={r.id} style={{ background: "var(--card)", border: "1px solid var(--line)", borderRadius: 10, padding: "10px 12px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                <div style={{ fontSize: 13.5, fontWeight: 600 }}>{leaveLabel(r.type)}</div>
                <StatusBadge status={r.status} />
              </div>
              <div style={{ fontSize: 11.5, color: "var(--ink-soft)", marginTop: 2 }}>
                {fmtDate(r.fromDate, dateFormat)}{r.fromDate !== r.toDate ? " – " + fmtDate(r.toDate, dateFormat) : ""} · {r.days} day{r.days === 1 ? "" : "s"}
              </div>
              {r.note && <div style={{ fontSize: 11.5, color: "var(--ink-soft)", marginTop: 4, fontStyle: "italic" }}>"{r.note}"</div>}
              {r.status === "Rejected" && r.reviewNote && <div style={{ fontSize: 11.5, color: "var(--rejected)", marginTop: 4 }}>Admin note: {r.reviewNote}</div>}
              {r.status === "Pending" && <button onClick={() => onWithdraw(r.id)} style={{ ...ghostBtn, marginTop: 8, fontSize: 11.5, padding: "5px 10px" }}>Withdraw</button>}
            </div>
          ))}
        </div>
      </Card>
    </div>
  );
}

function TeamLeave({ allLeaveRequests, staffMap, dateFormat, onApprove, onReject, onExport }) {
  const [reviewNoteDraft, setReviewNoteDraft] = useState({});
  const pending = allLeaveRequests.filter((r) => r.status === "Pending");
  const todayKey = localDateKey();
  const onLeaveToday = allLeaveRequests.filter((r) => r.status === "Approved" && r.fromDate <= todayKey && r.toDate >= todayKey);

  return (
    <div style={{ display: "grid", gap: 20 }}>
      <Card>
        <div style={{ fontFamily: "'Lora', serif", fontSize: 16, fontWeight: 600, marginBottom: 12 }}>Pending requests ({pending.length})</div>
        <div style={{ display: "grid", gap: 10 }}>
          {pending.length === 0 && <div style={{ color: "var(--ink-soft)", fontSize: 13 }}>Nothing pending.</div>}
          {pending.map((r) => {
            const s = staffMap[r.staffUid] || {};
            return (
              <div key={r.staffUid + r.id} style={{ borderBottom: "1px solid var(--line)", paddingBottom: 10 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
                  <div>
                    <div style={{ fontSize: 13.5, fontWeight: 600 }}>{s.name || r.staffUid} <span style={{ fontWeight: 400, color: "var(--ink-soft)", fontSize: 12 }}>· {leaveLabel(r.type)}</span></div>
                    <div style={{ fontSize: 11.5, color: "var(--ink-soft)", marginTop: 2 }}>
                      {fmtDate(r.fromDate, dateFormat)}{r.fromDate !== r.toDate ? " – " + fmtDate(r.toDate, dateFormat) : ""} · {r.days} day{r.days === 1 ? "" : "s"}
                    </div>
                    {r.note && <div style={{ fontSize: 12, color: "var(--ink-soft)", marginTop: 2, fontStyle: "italic" }}>"{r.note}"</div>}
                  </div>
                </div>
                <div style={{ display: "flex", gap: 8, marginTop: 8, flexWrap: "wrap" }}>
                  <input placeholder="Note (optional, shown on reject)" value={reviewNoteDraft[r.id] || ""} onChange={(e) => setReviewNoteDraft((d) => ({ ...d, [r.id]: e.target.value }))}
                    style={{ ...inputStyle, flex: 1, minWidth: 160, fontSize: 12.5 }} />
                  <button onClick={() => onApprove(r.staffUid, r.id, reviewNoteDraft[r.id] || "")} style={{ ...ghostBtn, padding: "6px 10px", fontSize: 11.5, borderColor: "var(--approved)", color: "var(--approved)" }}>Approve</button>
                  <button onClick={() => onReject(r.staffUid, r.id, reviewNoteDraft[r.id] || "")} style={{ ...ghostBtn, padding: "6px 10px", fontSize: 11.5, borderColor: "var(--rejected)", color: "var(--rejected)" }}>Reject</button>
                </div>
              </div>
            );
          })}
        </div>
      </Card>

      <Card>
        <div style={{ fontFamily: "'Lora', serif", fontSize: 16, fontWeight: 600, marginBottom: 12 }}>On leave today</div>
        {onLeaveToday.length === 0 && <div style={{ color: "var(--ink-soft)", fontSize: 13 }}>Nobody's on approved leave today.</div>}
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          {onLeaveToday.map((r) => {
            const s = staffMap[r.staffUid] || {};
            return (
              <div key={r.staffUid + r.id} style={{ background: "var(--paper-dark)", borderRadius: 999, padding: "5px 12px", fontSize: 12, fontWeight: 600 }}>
                {s.name || r.staffUid} · {leaveLabel(r.type)}
              </div>
            );
          })}
        </div>
      </Card>

      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, flexWrap: "wrap", gap: 8 }}>
          <div style={{ fontFamily: "'Lora', serif", fontSize: 16, fontWeight: 600 }}>All leave requests</div>
          <button onClick={() => onExport(allLeaveRequests)} style={ghostBtn}>Export CSV</button>
        </div>
        <div style={{ display: "grid", gap: 2 }}>
          {allLeaveRequests.length === 0 && <div style={{ color: "var(--ink-soft)", fontSize: 13 }}>None yet.</div>}
          {allLeaveRequests.map((r) => {
            const s = staffMap[r.staffUid] || {};
            return (
              <div key={r.staffUid + r.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: "1px solid var(--line)", fontSize: 13, gap: 8, flexWrap: "wrap" }}>
                <span>{s.name || r.staffUid} · {leaveLabel(r.type)} · {fmtDate(r.fromDate, dateFormat)}{r.fromDate !== r.toDate ? "–" + fmtDate(r.toDate, dateFormat) : ""} · {r.days}d</span>
                <StatusBadge status={r.status} />
              </div>
            );
          })}
        </div>
      </Card>
    </div>
  );
}

// ---------- Attendance Analysis: dynamic staff-wise / status-wise / time-period
// filters and charts. Fills in synthetic "Absent" entries for days with no record
// (matching Team Attendance's convention), skipping each location's weekly-off days.
function AttendanceAnalysis({ allAttendance, staffMap, locations, dateFormat }) {
  const [staffFilter, setStaffFilter] = useState("All");
  const [statusFilter, setStatusFilter] = useState("All");
  const [locFilter, setLocFilter] = useState("All");
  const [fromDate, setFromDate] = useState(() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-01`; });
  const [toDate, setToDate] = useState(() => localDateKey());
  const [view, setView] = useState("table");

  const staffNameList = useMemo(() => Object.values(staffMap).map((s) => s.name).filter(Boolean), [staffMap]);
  const locName = (id) => (locations.find((l) => l.id === id) || {}).name || "—";
  const locsById = useMemo(() => Object.fromEntries(locations.map((l) => [l.id, l])), [locations]);

  // Quick month-badge filters — Nepali months when the header's AD/BS toggle
  // is set to BS, English months when it's AD. Picking one sets From/To to
  // that month's boundaries in one tap instead of two date pickers.
  const monthChips = useMemo(() => {
    if (dateFormat === "BS") {
      const NDClass = (typeof NepaliDate !== "undefined" && NepaliDate && NepaliDate.default) ? NepaliDate.default : null;
      if (!NDClass) return [];
      try {
        const bsYear = new NDClass(new Date()).getYear();
        return BS_MONTH_NAMES.map((name, idx) => {
          const range = getBsMonthRange(bsYear, idx);
          return range ? { label: name, from: range.from, to: range.to } : null;
        }).filter(Boolean);
      } catch (e) { return []; }
    }
    const adYear = new Date().getFullYear();
    return AD_MONTH_NAMES.map((name, idx) => {
      const from = `${adYear}-${String(idx + 1).padStart(2, "0")}-01`;
      const lastDay = new Date(adYear, idx + 1, 0).getDate();
      const to = `${adYear}-${String(idx + 1).padStart(2, "0")}-${String(lastDay).padStart(2, "0")}`;
      return { label: name, from, to };
    });
  }, [dateFormat]);

  // Absent staff never get a database record for that day, so to show them here
  // (matching how Team Attendance already treats "no record" as Absent), we fill in
  // one synthetic Absent entry per active staff for every day in the selected range
  // that has neither a real attendance record nor an approved-leave day, skipping
  // that staff's location's weekly-off days, up to today.
  const withAbsences = useMemo(() => {
    if (!fromDate || !toDate) return allAttendance;
    const activeStaff = Object.entries(staffMap || {}).filter(([, s]) => s.active !== false).map(([uid, s]) => ({ uid, ...s }));
    const existingKeys = new Set(allAttendance.map((a) => a.staffUid + "|" + a.date));
    const todayKey = localDateKey();
    const cappedTo = toDate > todayKey ? todayKey : toDate;
    const localKeyOf = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    const synthetic = [];
    for (let d = new Date(fromDate + "T00:00:00"); localKeyOf(d) <= cappedTo; d.setDate(d.getDate() + 1)) {
      const dateKey = localKeyOf(d);
      const dow = d.getDay();
      activeStaff.forEach((s) => {
        const loc = s.locationId ? locsById[s.locationId] : null;
        const weeklyOff = (loc && loc.weeklyOff) || [];
        if (weeklyOff.includes(dow)) return;
        if (!existingKeys.has(s.uid + "|" + dateKey)) {
          synthetic.push({ staffUid: s.uid, date: dateKey, status: "absent", locationId: s.locationId });
        }
      });
    }
    return [...allAttendance, ...synthetic];
  }, [allAttendance, staffMap, locsById, fromDate, toDate]);

  const isNoCheckout = (a) => ["present", "late", "half_day"].includes(a.status) && a.checkInTime && !a.checkOutTime;

  const filtered = useMemo(() => withAbsences.filter((a) => {
    const s = staffMap[a.staffUid] || {};
    return (staffFilter === "All" || s.name === staffFilter) &&
      (statusFilter === "All" || (statusFilter === "no_checkout" ? isNoCheckout(a) : a.status === statusFilter)) &&
      (locFilter === "All" || a.locationId === locFilter) &&
      (!fromDate || a.date >= fromDate) && (!toDate || a.date <= toDate);
  }).sort((a, b) => b.date.localeCompare(a.date)), [withAbsences, staffMap, staffFilter, statusFilter, locFilter, fromDate, toDate]);

  const totals = useMemo(() => {
    const t = { total: 0, present: 0, late: 0, half_day: 0, on_leave: 0, awaiting_checkin: 0, absent: 0 };
    filtered.forEach((a) => { t.total++; if (t[a.status] != null) t[a.status]++; });
    return t;
  }, [filtered]);

  const byStaff = useMemo(() => {
    const m = {}; filtered.forEach((a) => { const n = (staffMap[a.staffUid] || {}).name || a.staffUid; m[n] = (m[n] || 0) + 1; });
    return Object.entries(m).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
  }, [filtered, staffMap]);

  const byStatus = useMemo(() => {
    const m = {}; filtered.forEach((a) => { const label = (ATT_STATUS_META[a.status] || {}).label || a.status; m[label] = (m[label] || 0) + 1; });
    return Object.entries(m).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
  }, [filtered]);

  const byLocation = useMemo(() => {
    const m = {}; filtered.forEach((a) => { const n = a.locationId ? locName(a.locationId) : "No location"; m[n] = (m[n] || 0) + 1; });
    return Object.entries(m).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
  }, [filtered, locations]);

  const byMonth = useMemo(() => {
    const m = {}; filtered.forEach((a) => { const k = monthKey(a.date); m[k] = (m[k] || 0) + 1; });
    return Object.entries(m).map(([name, value]) => ({ name, value })).sort((a, b) => a.name.localeCompare(b.name));
  }, [filtered]);

  const exportCSV = () => {
    const header = ["Date", "Staff", "Status", "Check-in", "Check-out", "Location", "Method", "Note", "Late Remark"];
    const lines = [header.join(",")];
    filtered.forEach((a) => {
      const s = staffMap[a.staffUid] || {};
      const cells = [a.date, s.name || a.staffUid, (ATT_STATUS_META[a.status] || {}).label || a.status, fmtTimeLabel(a.checkInTime), fmtTimeLabel(a.checkOutTime), a.locationId ? locName(a.locationId) : "", a.method || "", a.note || "", a.lateRemark || ""]
        .map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`);
      lines.push(cells.join(","));
    });
    const blob = new Blob([lines.join("\n")], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a2 = document.createElement("a");
    a2.href = url; a2.download = `mypower_attendance_${todayStr()}.csv`;
    document.body.appendChild(a2); a2.click(); a2.remove(); URL.revokeObjectURL(url);
  };

  return (
    <div style={{ display: "grid", gap: 16 }}>
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
        <StatCard label="Total records" value={totals.total} format={fmtCount} />
        <StatCard label="Present" value={totals.present} accent="var(--approved)" format={fmtCount} />
        <StatCard label="Late" value={totals.late} accent="var(--pending)" format={fmtCount} />
        <StatCard label="Half day" value={totals.half_day} accent="var(--paid)" format={fmtCount} />
        <StatCard label="Absent" value={totals.absent} accent="var(--rejected)" format={fmtCount} />
        <StatCard label="On leave" value={totals.on_leave} accent="var(--on-leave)" format={fmtCount} />
        <StatCard label="Awaiting approval" value={totals.awaiting_checkin} accent="var(--pending)" format={fmtCount} />
      </div>

      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
        <select value={staffFilter} onChange={(e) => setStaffFilter(e.target.value)} style={smallSelect}>
          <option>All</option>{staffNameList.map((s) => <option key={s}>{s}</option>)}
        </select>
        <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} style={smallSelect}>
          <option value="All">All</option>{Object.entries(ATT_STATUS_META).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
          <option value="no_checkout">No checkout</option>
        </select>
        <select value={locFilter} onChange={(e) => setLocFilter(e.target.value)} style={smallSelect}>
          <option value="All">All</option>{locations.map((l) => <option key={l.id} value={l.id}>{l.name}</option>)}
        </select>
        <span style={{ fontSize: 12, color: "var(--ink-soft)" }}>From</span>
        <input type="date" value={fromDate} onChange={(e) => setFromDate(e.target.value)} style={{ ...smallSelect, padding: "7px 9px" }} />
        <span style={{ fontSize: 12, color: "var(--ink-soft)" }}>To</span>
        <input type="date" value={toDate} onChange={(e) => setToDate(e.target.value)} style={{ ...smallSelect, padding: "7px 9px" }} />
        <div style={{ marginLeft: "auto", display: "flex", gap: 6, flexWrap: "wrap" }}>
          {[["table", "Table"], ["calendar", "Calendar"], ["staff", "By Staff"], ["status", "By Status"], ["location", "By Location"], ["trend", "Monthly Trend"]].map(([id, label]) => (
            <button key={id} onClick={() => setView(id)} style={{ ...ghostBtn, background: view === id ? "var(--ink)" : "var(--card)", color: view === id ? "var(--paper)" : "var(--ink)" }}>{label}</button>
          ))}
          <button onClick={exportCSV} style={ghostBtn}>Export CSV</button>
        </div>
      </div>

      {monthChips.length > 0 && (
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {monthChips.map((m) => {
            const active = fromDate === m.from && toDate === m.to;
            return (
              <button key={m.label} onClick={() => { setFromDate(m.from); setToDate(m.to); }}
                style={{ ...ghostBtn, padding: "4px 10px", fontSize: 11.5, background: active ? "var(--ink)" : "var(--card)", color: active ? "var(--paper)" : "var(--ink)" }}>{m.label}</button>
            );
          })}
        </div>
      )}

      {view === "table" && (
        <div style={{ display: "grid", gap: 2 }}>
          {filtered.length === 0 && <Card style={{ color: "var(--ink-soft)" }}>No attendance records match these filters.</Card>}
          {filtered.map((a) => {
            const s = staffMap[a.staffUid] || {};
            const noCheckout = isNoCheckout(a);
            return (
              <div key={a.staffUid + a.date} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 0", borderBottom: "1px solid var(--line)", gap: 10, flexWrap: "wrap", background: noCheckout ? "rgba(193,68,14,0.06)" : "transparent" }}>
                <div>
                  <div style={{ fontSize: 13.5, fontWeight: 600 }}>{s.name || a.staffUid} <span style={{ fontWeight: 400, color: "var(--ink-soft)", fontSize: 12 }}>· {fmtDate(a.date, dateFormat)}</span></div>
                  <div style={{ fontSize: 11.5, color: "var(--ink-soft)", marginTop: 2 }}>
                    {a.checkInTime ? fmtTimeLabel(a.checkInTime) : "—"}{a.checkOutTime ? " – " + fmtTimeLabel(a.checkOutTime) : ""} · {a.locationId ? locName(a.locationId) : "No location"}
                  </div>
                  {(a.geoLat != null || a.checkOutGeoLat != null) && (
                    <div style={{ marginTop: 2 }}><MapLink lat={a.geoLat} lng={a.geoLng} label="View check-in location" /></div>
                  )}
                  {a.lateRemark && <div style={{ fontSize: 11.5, color: "var(--ink-soft)", fontStyle: "italic", marginTop: 2 }}>"{a.lateRemark}"</div>}
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  {noCheckout && <span style={{ fontSize: 10.5, fontWeight: 600, color: "var(--no-checkout)", border: "1px solid var(--no-checkout)", borderRadius: 999, padding: "2px 8px" }}>No checkout</span>}
                  <StatusBadge status={a.status} metaMap={ATT_STATUS_META} />
                </div>
              </div>
            );
          })}
        </div>
      )}
      {view === "calendar" && (
        staffFilter === "All" ? (
          <Card style={{ color: "var(--ink-soft)" }}>Pick a specific staff above to see their calendar.</Card>
        ) : (() => {
          const uid = Object.keys(staffMap).find((k) => staffMap[k].name === staffFilter);
          const loc = uid && staffMap[uid].locationId ? locsById[staffMap[uid].locationId] : null;
          const records = allAttendance.filter((a) => a.staffUid === uid);
          return <Card><MonthCalendar records={records} weeklyOff={loc && loc.weeklyOff} dateFormat={dateFormat} /></Card>;
        })()
      )}
      {view === "staff" && <Card><SimpleBarChart data={byStaff} format={fmtCount} /></Card>}
      {view === "status" && <Card><SimpleBarChart data={byStatus} format={fmtCount} /></Card>}
      {view === "location" && <Card><SimpleBarChart data={byLocation} format={fmtCount} /></Card>}
      {view === "trend" && <Card><SimpleTrendChart data={byMonth} format={fmtCount} /></Card>}
    </div>
  );
}

function HomeScreen({ me, myProfile, myAttendance, isSuperAdmin, isMobile, onEnterExpense, onEnterAttendance, onEnterProfile, onEnterPeople, onEnterSalary, onSignOut }) {
  const profileStatus = (myProfile && myProfile.status) || "not_started";

  const photo = myProfile && myProfile.photo;
  const [bannerDismissed, setBannerDismissed] = useState(false);
  const [checkoutDismissed, setCheckoutDismissed] = useState(false);
  const yesterdayKey = useMemo(() => {
    const d = new Date();
    d.setDate(d.getDate() - 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }, []);
  const missedCheckout = useMemo(() => (myAttendance || []).find((a) => a.date === yesterdayKey && a.checkInTime && !a.checkOutTime) || null, [myAttendance, yesterdayKey]);
  const firstName = (me.name || "").split(" ")[0] || me.name;
  return (
    <div style={{ maxWidth: 640, margin: "0 auto", minHeight: "80vh", display: "flex", flexDirection: "column" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: isMobile ? "16px 16px 0" : "24px 24px 0" }}>

            <img src={photo} alt="Your profile" style={{ width: 40, height: 40, borderRadius: "50%", objectFit: "cover", border: "1px solid var(--line)" }} />

            <div style={{ width: 40, height: 40, borderRadius: "50%", background: "var(--card)", border: "1px solid var(--line)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 15, fontFamily: "'Lora', serif", color: "var(--ink-soft)" }}>{(me.name || "?")[0]}</div>
          )}
          {profilePending && <span style={{ position: "absolute", top: -1, right: -1, width: 10, height: 10, borderRadius: "50%", background: "var(--rejected)", border: "2px solid var(--paper)" }} />}
        </button>
        <button onClick={onSignOut} style={ghostBtn}>Sign out</button>
      </div>
      <div style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "center", padding: isMobile ? "20px 20px 40px" : "20px 20px 60px", textAlign: "center" }}>
        <Logo large />
        <div style={{ fontSize: 14, color: "var(--ink-soft)", margin: "16px 0 4px" }}>Hi, {me.name}</div>
        <div style={{ fontSize: 12.5, color: "var(--ink-soft)", marginBottom: 20, maxWidth: 380 }}>Log an expense, mark your attendance, or tap your photo up top to fill in or check your profile.</div>
        {profilePending && !bannerDismissed && (
          <div style={{ width: "100%", maxWidth: 420, background: "var(--card)", border: "1px solid var(--rejected)", borderRadius: 10, padding: "12px 14px", marginBottom: 20, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap", textAlign: "left" }}>
            <div style={{ fontSize: 12.5, color: "var(--rejected)", fontWeight: 600 }}>Your profile is incomplete — please submit it.</div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={onEnterProfile} style={{ ...ghostBtn, padding: "6px 10px", fontSize: 11.5, borderColor: "var(--rejected)", color: "var(--rejected)" }}>Complete now</button>
              <button onClick={() => setBannerDismissed(true)} style={{ ...ghostBtn, padding: "6px 10px", fontSize: 11.5 }}>Later</button>
            </div>
          </div>
        )}
        {missedCheckout && !checkoutDismissed && (
          <div style={{ width: "100%", maxWidth: 420, background: "var(--card)", border: "1px solid var(--no-checkout)", borderRadius: 10, padding: "12px 14px", marginBottom: 20, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap", textAlign: "left" }}>
            <div style={{ fontSize: 12.5, color: "var(--no-checkout)", fontWeight: 600 }}>Hi {firstName} — looks like you forgot to check out yesterday. Don't forget today! Have a good day 🙂</div>
            <button onClick={() => setCheckoutDismissed(true)} style={{ ...ghostBtn, padding: "6px 10px", fontSize: 11.5, borderColor: "var(--no-checkout)", color: "var(--no-checkout)" }}>Got it</button>
          </div>
        )}
        <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr", gap: 16, width: "100%" }}>
          <HomeCard label="Record your expense" sub="Log a claim, check on past ones, or see your spending." accent="var(--brand-yellow)" onClick={onEnterExpense} />
          <HomeCard label="Mark your attendance" sub="Check in, check out, or see your attendance history." accent="var(--approved)" onClick={onEnterAttendance} />
        </div>
        {isSuperAdmin && (
          <div style={{ display: "flex", gap: 10, marginTop: 28, flexWrap: "wrap", justifyContent: "center" }}>
            <button onClick={onEnterPeople} style={ghostBtn}>Staff & permissions →</button>
            <button onClick={onEnterSalary} style={ghostBtn}>Salary →</button>
          </div>
        )}
      </div>
    </div>
  );
}

function buildProfileForm(profile, currentName) {
  const p = profile || {};
  return {
    name: p.name || currentName || "", staffCode: p.staffCode || "", phone: p.phone || "", designation: p.designation || "", joinDate: p.joinDate || "",
    department: p.department || "", employmentType: p.employmentType || "Full-time",
    emergencyName: p.emergencyName || "", emergencyPhone: p.emergencyPhone || "", bloodGroup: p.bloodGroup || "", dob: p.dob || "",
    tempAddress: p.tempAddress || "", permanentAddress: p.permanentAddress || "", photo: p.photo || null,
  };
}
function buildSensitiveForm(sensitive) {
  const s = sensitive || {};
  return {
    bankName: s.bankName || "", branchName: s.branchName || "", bankAccount: s.bankAccount || "", citizenshipNumber: s.citizenshipNumber || "",
    panNumber: s.panNumber || "", citizenshipImage: s.citizenshipImage || null, panImage: s.panImage || null,
  };
}
function readableValue(field, val) {
  if (!val) return "—";
  if (field === "photo" || field === "citizenshipImage" || field === "panImage") return null; // rendered as image instead
  return val;
}

function AdminSetSummary({ profile }) {

  return (

      {!hasAny ? (

          {ADMIN_PROFILE_FIELDS.map((f) => (
            <div key={f}>
              <div style={{ fontSize: 11, color: "var(--ink-soft)" }}>{ADMIN_PROFILE_LABELS[f]}</div>
              <div>{p[f] || "—"}</div>
            </div>
          ))}
        </div>
      )}
